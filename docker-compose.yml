services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: .
    env_file: .env
    user: "0:0"
    command: >
      sh -c "mkdir -p /app/staticfiles && chown -R app:app /app/staticfiles &&
      su -s /bin/sh app -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    depends_on:
      init:
        condition: service_completed_successfully

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python manage.py runbot
    depends_on:
      init:
        condition: service_completed_successfully

  trader:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python manage.py runtrader
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro

volumes:
  postgres_data:
  static_data:
